# Build-and-run shortcuts for each native chrome, each pinned to whichever
# target that crate actually applies to (see the per-crate `#![cfg(target_os
# = "...")]` guards).
[alias]
run-gtk3 = "run -p browser-linux-gtk3"

# browser-windows-reactor only needs to cross-*compile* — cargo-xwin's own
# "build" verb *is* reachable directly through [alias] the same way
# run-gtk3 reaches cargo's built-in "run" (see
# crates/browser-windows-reactor/src/lib.rs's module doc comment).
build-windows-reactor = "xwin build --target x86_64-pc-windows-msvc -p browser-windows-reactor"

# The windows-reactor web-standards driver (see web-standards-tests/src/bin/
# windows_driver.rs) — cross-compiles the same way as the app itself.
build-web-standards-driver-windows = "xwin build --target x86_64-pc-windows-msvc -p web-standards-tests --bin web-standards-driver-windows"

# Statically link the MSVC C runtime into anything built for this target, so
# the resulting .exe doesn't depend on VCRUNTIME140.dll/msvcp140.dll being
# present on the machine that runs it — confirmed the hard way: a
# cargo-xwin-built binary refused to start on a fresh Windows VM with no
# Visual C++ Redistributable installed ("VCRUNTIME140.dll was not found").
# Scoped to the target triple, not `[env]`, so — unlike the CC/AR note below
# — this is safe to keep tracked in the repo: it only ever applies when
# actually building *for* x86_64-pc-windows-msvc, cross-compiled from here or
# natively on real Windows, and static-CRT is a reasonable default for a
# standalone app either way (see scripts/windows-vm/README.md).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# browser-macos-appkit cross-compiles from Linux via `cargo zigbuild` plus a
# macOS SDK for the Apple framework stubs the link step needs — neither of
# those can be reached through a plain [alias] the way
# build-windows-reactor is (cargo-xwin bundles its own SDK-fetcher;
# cargo-zigbuild needs Zig on PATH and SDKROOT set up first, which aliases
# can't do). Use .cargo/build-macos-appkit.sh instead (see README.md's
# "browser-macos-appkit: building" section).

# `wry`'s own build.rs decides whether to register a WKUIDelegate method
# that doesn't exist before macOS 12 by running `#[cfg(target_os =
# "macos")] util::operating_system_version()` — i.e. it inspects the *build
# machine's* OS version, not the deployment/runtime target. That's a
# correct-enough heuristic for a native build (you're building for the
# machine you're on), but always wrong for cross-compiling from Linux: the
# check never even runs (no macOS host to run it on), so it always assumes
# "new enough" and registers the method regardless of the real target OS —
# confirmed directly: it panicked at startup on a real 2014 MacBook running
# Big Sur ("failed overriding protocol method -[WKUIDelegate webView:
# requestMediaCapturePermissionForOrigin:...]: method not found") even
# after pinning render-engine's wry dependency to the specific upstream
# commit (tauri-apps/wry#1781) that's supposed to guard exactly this.
# Forcing the same `--cfg` flag here, unconditionally, sidesteps wry's
# broken build-machine-based detection entirely: it costs the optional
# custom getUserMedia-permission delegate on every macOS build (cross-
# compiled or native, old target OS or new) in exchange for correctness
# everywhere — a fine trade, since nothing in this codebase implements or
# relies on that delegate actually being registered.
[target.x86_64-apple-darwin]
rustflags = ["--cfg", "macos_12_unavailable"]

[target.aarch64-apple-darwin]
rustflags = ["--cfg", "macos_12_unavailable"]

# browser-core pulls in libsql, whose libsql-ffi dependency compiles a
# bundled sqlite3.c via cc-rs for *every* target it's built for, including
# x86_64-pc-windows-msvc. cargo-xwin sets CC/AR for that target to the bare
# names "clang-cl"/"llvm-lib" and leaves finding them on PATH to the caller
# (unlike cargo-zigbuild, which bundles its own self-contained C
# toolchain) — those tools do exist (Ubuntu's clang-21/lld-21/llvm-21
# packages), just not symlinked as plain, unversioned names on default PATH.
#
# This used to live here as a repo-tracked `[env]` table, but that broke a
# genuine native-Windows build (GitHub Actions' windows-latest runner):
# `[env]` entries apply unconditionally regardless of host OS, so the
# native runner picked up this Linux-only clang-cl path too and failed with
# "failed to find tool /usr/lib/llvm-21/bin/clang-cl" — a path that only
# exists on this dev machine's cargo-xwin cross-compile setup, and would
# never be right on a real Windows/macOS box. Cargo config also merges in
# `$CARGO_HOME/config.toml` (i.e. `~/.cargo/config.toml`), which is NOT
# checked into the repo — that's where these two lines now live on this
# machine, which is the correct place for "where a tool happens to be
# installed on this specific box". If `cargo build-windows-reactor` ever fails
# here with a similar ToolNotFound error, check `~/.cargo/config.toml` first.
