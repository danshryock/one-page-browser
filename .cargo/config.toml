# Lets `cargo run`/`cargo test --target x86_64-pc-windows-gnu` execute the
# resulting .exe under Wine automatically, instead of needing
# `wine target/x86_64-pc-windows-gnu/debug/foo.exe` typed out by hand every
# time (see README.md's cross-compiling section). Only affects this target —
# native Linux/Windows builds are unaffected.
#
# The runner is a small wrapper script (rather than plain "wine") so it can
# also point Wine at WebView2Loader.dll's vendored location via WINEPATH —
# see .cargo/wine-runner.sh for why.
[target.x86_64-pc-windows-gnu]
runner = ".cargo/wine-runner.sh"

# Build-and-run shortcuts for each native chrome, each pinned to whichever
# target that crate actually applies to (see the per-crate `#![cfg(target_os
# = "...")]` guards) — the two Windows ones go through the runner above, so
# `cargo run-win32`/`cargo run-nwg` launch under Wine automatically, same as
# a plain `cargo run --target x86_64-pc-windows-gnu -p ...` would.
[alias]
run-gtk3 = "run -p browser-linux-gtk3"
run-win32 = "run --target x86_64-pc-windows-gnu -p browser-windows-win32"
run-nwg = "run --target x86_64-pc-windows-gnu -p browser-windows-nwg"
# browser-wx (wxDragon) isn't target-gated — see crates/browser-wx/src/lib.rs
# — so this alias just runs it natively here, same as any other crate.
run-wx = "run -p browser-wx"
# There's no [alias] equivalent of run-win32/run-nwg for browser-wx's Windows
# cross-build: it needs `cargo zigbuild` (see README.md), which — despite
# having its own internal "run" verb that builds *and* launches — can't be
# reached through Cargo's [alias]/subcommand dispatch. Cargo always invokes
# an external plugin as `cargo-<name> <name> <rest>` (repeating the matched
# name), so "zigbuild run ..." arrives at the cargo-zigbuild binary as
# arguments to its own "zigbuild" verb, which doesn't recognize "run" and
# errors — there's no way to get "run" to be the verb cargo-zigbuild receives
# through `cargo <anything>`. Use `.cargo/run-wx-wine.sh` instead, which
# calls `cargo zigbuild` (the build verb, which *is* reachable this way) and
# then the wine-runner.sh above directly, in one script.

# browser-windows-winui only needs to cross-*compile* (see
# crates/browser-windows-winui/src/lib.rs) — it's never run, so unlike
# browser-wx above there's no "run" verb to route around, and cargo-xwin's
# own "build" verb *is* reachable directly through [alias] the same way
# run-win32/run-nwg reach cargo's built-in "run".
build-windows-winui = "xwin build --target x86_64-pc-windows-msvc -p browser-windows-winui"

# browser-core pulls in libsql, whose libsql-ffi dependency compiles a
# bundled sqlite3.c via cc-rs for *every* target it's built for, including
# x86_64-pc-windows-msvc. cargo-xwin sets CC/AR for that target to the bare
# names "clang-cl"/"llvm-lib" and leaves finding them on PATH to the caller
# (unlike cargo-zigbuild, which bundles its own self-contained C
# toolchain) — those tools do exist (Ubuntu's clang-21/lld-21/llvm-21
# packages), just not symlinked as plain, unversioned names on default PATH.
# force = true so this wins over cargo-xwin's own "clang-cl"/"llvm-lib"
# (bare names it puts in the child build's environment), since plain [env]
# entries only apply when a var isn't already set.
[env]
CC_x86_64_pc_windows_msvc = { value = "/usr/lib/llvm-21/bin/clang-cl", force = true }
AR_x86_64_pc_windows_msvc = { value = "/usr/lib/llvm-21/bin/llvm-lib", force = true }
