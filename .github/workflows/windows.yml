name: Windows

# Runs on GitHub's real windows-latest runners — genuine Windows, not a
# cross-compile or Wine emulation. This is deliberately independent of the
# xwin/cargo-xwin cross-compilation setup documented in README.md (used for
# local development on Linux): a native Windows machine already has the real
# MSVC toolchain and Windows SDK, so none of that is needed here — this
# workflow builds every Windows crate the plain, direct way
# (`cargo build`/`cargo test`, no `cargo xwin`), and — for
# browser-windows-winui specifically — actually *launches* it, which has
# never been possible before (Wine can't host the real Windows App SDK/
# WebView2 runtime WinUI 3 needs; see ROADMAP.md).
#
# browser-windows-win32/browser-windows-nwg/browser-wx are intentionally not
# built here — deprioritized in favor of browser-windows-winui (see
# ROADMAP.md's "Done" section); win32/nwg already have a working local
# Wine-based build+run loop, so there's little this workflow would add for
# them.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    name: Test browser-core + check render-engine (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # browser-core is meant to work on every platform; encryption-specific
      # tests are #[cfg(target_os = "linux")]-gated (real HistoryStore
      # encryption is Linux-only for now — see Cargo.toml/history.rs) so this
      # exercises everything else for real on native Windows, something the
      # Linux-only local dev loop never has.
      - name: cargo test -p browser-core
        run: cargo test -p browser-core --verbose

      # render-engine's windows.rs (win32/nwg's WryEngine) and winui.rs
      # (WebView2Engine) both compile on this target; a plain `check` (rather
      # than `build`, which browser-windows-winui's own job below already
      # covers via its dependency on render-engine) is enough to confirm the
      # crate itself is sound here.
      - name: cargo check -p render-engine
        run: cargo check -p render-engine --verbose

  build-and-smoke-winui:
    name: Build + launch browser-windows-winui (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # WinUI 3's Microsoft.UI.Xaml.* types aren't in the OS's WinRT catalog
      # until the Windows App SDK framework package is present and located
      # via PackageDependency::initialize_version(WindowsAppSDKVersion::V2)
      # (see browser-windows-winui/src/main.rs's comment on that call) —
      # skipping this produces a "Class not registered" error at runtime.
      #
      # First real run (see summaries/windows-github-actions-ci.md's "Update"
      # section) showed this step reporting "success" while the app still
      # crashed at launch with
      # STATUS_DLL_NOT_FOUND (0xC000027B) — a loader-level failure before any
      # of our own code runs, consistent with the installer silently failing:
      # `Start-Process -Wait` alone doesn't surface the child process's own
      # exit code, so a failed install looked identical to a successful one
      # in the log. This version captures and prints that exit code, and logs
      # whether the AppX package actually landed, so the next failure (if
      # any) is diagnosable from this step's own output instead of inferred
      # from a cryptic crash three steps later.
      - name: Install Windows App SDK runtime (v2.x)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\windowsappruntimeinstall-x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/2.0/latest/windowsappruntimeinstall-x64.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "--quiet" -Wait -PassThru
          Write-Host "installer exit code: $($proc.ExitCode)"

          $pkg = Get-AppxPackage -Name "*WindowsAppRuntime*"
          if ($pkg) {
            $pkg | Format-List Name, Version, InstallLocation
          } else {
            Write-Warning "no WindowsAppRuntime AppX package found after running the installer"
          }

      - name: Build (native MSVC — no cargo-xwin needed on a real Windows runner)
        run: cargo build -p browser-windows-winui --target x86_64-pc-windows-msvc --verbose

      # windows-latest runners provide a real interactive desktop session
      # (unlike Linux runners), so this can actually launch a visible window
      # and screenshot it — genuine visual confirmation the app renders,
      # rather than only "it compiled and linked."
      #
      # First real run crashed with exit code -1073741189 (0xC000027B,
      # STATUS_STOWED_EXCEPTION — a Windows fast-fail for an unhandled
      # exception, verified against ntstatus.h; an earlier version of this
      # comment guessed DLL_NOT_FOUND without checking, which was wrong).
      # Redirecting stdout/stderr (added after that first run) captured
      # *nothing* on the next run — no panic message, no eprintln! output —
      # meaning the crash happens too early/abruptly for normal stream
      # flushing, consistent with a fast-fail bypassing the CRT's usual
      # cleanup. This version registers a Windows Error Reporting local dump
      # for this exe before launching it, so a genuine crash dump gets
      # written on the next failure — analyzed inline with `cdb` (Windows
      # SDK Debugging Tools) if it's present on this runner image, otherwise
      # uploaded raw as an artifact. This is a real, first-ever debugging
      # pass for browser-windows-winui (see ROADMAP.md) — expect this to
      # take a few more rounds.
      - name: Launch and screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "browser-windows-winui.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "browser-windows-winui.exe not found under target/ after build"
            exit 1
          }

          $dumpFolder = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force -Path $dumpFolder | Out-Null
          $werKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\browser-windows-winui.exe"
          New-Item -Path $werKey -Force | Out-Null
          Set-ItemProperty -Path $werKey -Name DumpFolder -Value $dumpFolder -Type ExpandString
          Set-ItemProperty -Path $werKey -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $werKey -Name DumpCount -Value 3 -Type DWord

          $env:RUST_BACKTRACE = "full"
          $stdout = "$env:GITHUB_WORKSPACE\browser-windows-winui-stdout.log"
          $stderr = "$env:GITHUB_WORKSPACE\browser-windows-winui-stderr.log"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8

          Write-Host "--- stdout ---"
          Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content $stderr -ErrorAction SilentlyContinue
          Write-Host "--------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Error "browser-windows-winui exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex) — see stdout/stderr above, and the logs/dumps uploaded as artifacts"

            # WER can take a moment to finish writing the dump after the
            # process actually dies.
            Start-Sleep -Seconds 5
            $dumps = Get-ChildItem -Path $dumpFolder -Filter *.dmp -ErrorAction SilentlyContinue
            if ($dumps) {
              Write-Host "crash dump(s) found: $($dumps.FullName -join ', ')"
              $cdb = Get-Command cdb.exe -ErrorAction SilentlyContinue
              if ($cdb) {
                foreach ($d in $dumps) {
                  Write-Host "--- cdb !analyze -v on $($d.Name) ---"
                  & $cdb.Path -z $d.FullName -c "!analyze -v; q" 2>&1 | Out-String | Write-Host
                }
              } else {
                Write-Host "cdb.exe not found on this runner's PATH — uploading raw dump(s) as artifacts instead"
              }
            } else {
              Write-Host "no crash dump was generated in $dumpFolder"
            }

            exit 1
          }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:GITHUB_WORKSPACE\browser-windows-winui-screenshot.png")

          Stop-Process -Id $proc.Id -Force

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-logs
          path: |
            browser-windows-winui-stdout.log
            browser-windows-winui-stderr.log
          if-no-files-found: ignore

      # Raw dumps, for offline analysis if `cdb` wasn't available on this
      # runner to analyze them inline above.
      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-crash-dumps
          path: ${{ runner.temp }}\dumps\*.dmp
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-screenshot
          path: browser-windows-winui-screenshot.png
          if-no-files-found: ignore
