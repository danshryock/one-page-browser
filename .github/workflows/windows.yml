name: Windows

# Runs on GitHub's real windows-latest runners — genuine Windows, not a
# cross-compile or Wine emulation. This is deliberately independent of the
# xwin/cargo-xwin cross-compilation setup documented in README.md (used for
# local development on Linux): a native Windows machine already has the real
# MSVC toolchain and Windows SDK, so none of that is needed here — this
# workflow builds every Windows crate the plain, direct way
# (`cargo build`/`cargo test`, no `cargo xwin`), and — for
# browser-windows-winui specifically — actually *launches* it, which has
# never been possible before (Wine can't host the real Windows App SDK/
# WebView2 runtime WinUI 3 needs; see ROADMAP.md).
#
# browser-windows-win32/browser-windows-nwg/browser-wx are intentionally not
# built here — deprioritized in favor of browser-windows-winui (see
# ROADMAP.md's "Done" section); win32/nwg already have a working local
# Wine-based build+run loop, so there's little this workflow would add for
# them.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    name: Test browser-core + check render-engine (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # browser-core is meant to work on every platform; encryption-specific
      # tests are #[cfg(target_os = "linux")]-gated (real HistoryStore
      # encryption is Linux-only for now — see Cargo.toml/history.rs) so this
      # exercises everything else for real on native Windows, something the
      # Linux-only local dev loop never has.
      - name: cargo test -p browser-core
        run: cargo test -p browser-core --verbose

      # render-engine's windows.rs (win32/nwg's WryEngine) and winui.rs
      # (WebView2Engine) both compile on this target; a plain `check` (rather
      # than `build`, which browser-windows-winui's own job below already
      # covers via its dependency on render-engine) is enough to confirm the
      # crate itself is sound here.
      - name: cargo check -p render-engine
        run: cargo check -p render-engine --verbose

  build-and-smoke-winui:
    name: Build + launch browser-windows-winui (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # WinUI 3's Microsoft.UI.Xaml.* types aren't in the OS's WinRT catalog
      # until the Windows App SDK framework package is present and located
      # via PackageDependency::initialize_version(WindowsAppSDKVersion::V2)
      # (see browser-windows-winui/src/main.rs's comment on that call) —
      # skipping this produces a "Class not registered" error at runtime.
      #
      # First real run (see summaries/windows-github-actions-ci.md's "Update"
      # section) showed this step reporting "success" while the app still
      # crashed at launch with
      # STATUS_DLL_NOT_FOUND (0xC000027B) — a loader-level failure before any
      # of our own code runs, consistent with the installer silently failing:
      # `Start-Process -Wait` alone doesn't surface the child process's own
      # exit code, so a failed install looked identical to a successful one
      # in the log. This version captures and prints that exit code, and logs
      # whether the AppX package actually landed, so the next failure (if
      # any) is diagnosable from this step's own output instead of inferred
      # from a cryptic crash three steps later.
      - name: Install Windows App SDK runtime (v2.x)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\windowsappruntimeinstall-x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/2.0/latest/windowsappruntimeinstall-x64.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "--quiet" -Wait -PassThru
          Write-Host "installer exit code: $($proc.ExitCode)"

          $pkg = Get-AppxPackage -Name "*WindowsAppRuntime*"
          if ($pkg) {
            $pkg | Format-List Name, Version, InstallLocation
          } else {
            Write-Warning "no WindowsAppRuntime AppX package found after running the installer"
          }

      # Builds every binary in this package, including
      # src/bin/minimal_smoke_test.rs (see the next step's comment for why
      # that exists).
      - name: Build (native MSVC — no cargo-xwin needed on a real Windows runner)
        run: cargo build -p browser-windows-winui --target x86_64-pc-windows-msvc --verbose

      # Bisection: does *any* WinUI 3 app crash at first paint on this
      # runner (a genuine environment/WinUI 3 limitation), or is it specific
      # to something in browser-windows-winui's own code? `minimal_smoke_test`
      # (src/bin/) does the bare minimum: init, bootstrap, one Window,
      # Activate() — no subclassing, no custom title bar, no controls, no
      # WebView2. CONFIRMED (first real run): it survived past 8 seconds —
      # every checkpoint through `run() returned Ok` logged, process still
      # running, no crash — proving WinUI 3 itself works fine on this runner.
      # The bug is specific to something in this crate's own code.
      - name: Launch minimal WinUI 3 smoke test (no subclassing/controls)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "minimal_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "minimal_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- minimal-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\minimal-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "-------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "minimal_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "minimal_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Second bisection round, now that the fully-minimal test proved WinUI
      # 3 itself works here: adds *only* `SetExtendsContentIntoTitleBar` +
      # `SetTitleBar` (the custom title bar the real window uses, lib.rs
      # around its `SetExtendsContentIntoTitleBar(true)` call) — still no
      # HWND subclassing. CONFIRMED (first real run): this one also survived
      # cleanly — every checkpoint through `run() returned Ok`, no crash —
      # ruling out the custom title bar alone as the cause too.
      - name: Launch title-bar WinUI 3 smoke test (no subclassing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "titlebar_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "titlebar_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- titlebar-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\titlebar-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "--------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "titlebar_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "titlebar_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Third bisection round: minimal_smoke_test and titlebar_smoke_test
      # both survived, ruling out a bare window and the custom title bar
      # alone. The one remaining major piece of the real window neither test
      # exercises (besides install_hwnd_subclass/subclass_proc, still
      # untested in isolation) is the embedded `WebView2` XAML control itself
      # (`render_engine::WebView2Engine` — see render-engine/src/winui.rs) —
      # a much heavier native control than anything tried so far, backed by
      # a real Edge WebView2 process with its own runtime/user-data-folder
      # requirements. Mirrors that construction directly (still no HWND
      # subclassing, no custom title bar) and navigates to a real URL.
      # CONFIRMED (first real run): also survived cleanly, every checkpoint
      # through `run() returned Ok`, no crash — ruling out WebView2 alone too.
      - name: Launch WebView2 WinUI 3 smoke test (no subclassing/titlebar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "webview2_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "webview2_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- webview2-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\webview2-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "--------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "webview2_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "webview2_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Fourth bisection round for the real window's individually unusual
      # pieces of code: minimal_smoke_test, titlebar_smoke_test, and
      # webview2_smoke_test all survived cleanly, ruling out a bare window,
      # the custom title bar, and WebView2 each in isolation. This one adds
      # *only* SetWindowSubclass-based WNDPROC interception (the technique
      # lib.rs's install_hwnd_subclass/subclass_proc uses as a workaround for
      # winio-winui3's missing KeyDown/Window::Closed delegates — see that
      # module's doc comment), reimplemented standalone since those functions
      # are private to lib.rs and not reachable from a separate src/bin/
      # binary crate. CONFIRMED (first real run): also survived — and its
      # trace received the *exact same message sequence* through
      # WM_SETCURSOR (twice) that the real app crashes at, then kept
      # running. None of the four individual pieces reproduces the crash
      # alone.
      - name: Launch HWND-subclass WinUI 3 smoke test (no titlebar/WebView2)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "subclass_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "subclass_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- subclass-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\subclass-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "--------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "subclass_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "subclass_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Fifth round: since no single piece reproduces the crash, this tests
      # the specific combination most likely to interact badly — a WebView2
      # surface rendering underneath/near a custom-drawn, DWM-extended title
      # bar region is a real, previously documented tricky pairing for WinUI
      # 3 apps in general, independent of this CI environment. Still no HWND
      # subclassing. CONFIRMED (first real run): also survived cleanly —
      # every checkpoint logged, no crash.
      - name: Launch titlebar+WebView2 combination smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "titlebar_webview2_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "titlebar_webview2_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- titlebar-webview2-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\titlebar-webview2-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "------------------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "titlebar_webview2_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "titlebar_webview2_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Sixth combination round: title bar + WebView2 + HWND subclassing, all
      # three together — the last remaining pairwise/triple combination of
      # the real window's genuinely unusual pieces of code. CONFIRMED (first
      # real run): also survived, its trace going well *past* the exact
      # message sequence the real app crashes at (through WM_NCHITTEST/
      # WM_NCMOUSEMOVE/WM_MOUSELEAVE, messages the real crash never reaches)
      # with no crash at all.
      - name: Launch full-combination (titlebar+WebView2+subclass) smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "full_combo_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "full_combo_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- full-combo-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\full-combo-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "-----------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "full_combo_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "full_combo_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Seventh round — a genuinely different suspect: none of the six
      # binaries above touch browser_core at all. The real app's
      # build_window_and_app calls HistoryStore::open(&profile), which opens
      # a real libsql database. CONFIRMED (first real run): survived
      # cleanly, real queries and all (record_visit x2, search, "Found 2
      # entries" genuinely displayed) — but that same run finally produced
      # a real crash dump for the *actual app* (WER had silently failed to
      # write one every previous run). Analyzed locally with
      # minidump-stackwalk (`cargo install minidump-stackwalk`, no Windows
      # machine needed): the crashing thread's entire stack lives inside
      # Microsoft's own combase.dll/ucrtbase.dll/KERNELBASE.dll —
      # browser-windows-winui.exe is loaded but appears nowhere in any
      # thread's stack. See summaries/windows-github-actions-ci.md for the
      # full analysis. Conclusion: the fault is inside WinUI 3's own
      # Composition/WinRT internals, not this codebase's code.
      #
      # `browser_core::history`'s tokio runtime was still replaced with
      # `futures_executor::block_on` afterwards (see history.rs's module
      # doc comment) — not implicated by the crash dump, but a legitimate
      # simplification either way, since libsql's local backend is never
      # actually async and tokio's reactor/threading machinery was dead
      # weight.
      - name: Launch HistoryStore WinUI 3 smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "historystore_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "historystore_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- historystore-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\historystore-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "-------------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "historystore_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "historystore_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Eighth round: none of the seven binaries above matched the *exact
      # order* the real build_window_and_app does things in (content+title
      # bar -> HistoryStore/real queries -> WebView2 -> HWND subclass ->
      # Activate). Tests whether the specific interleaving/timing —
      # rather than any single piece in isolation, all seven of which
      # survived — matters. Uses the same post-tokio-removal
      # browser_core::HistoryStore as the "HistoryStore WinUI 3 smoke test"
      # step above.
      - name: Launch exact-construction-order WinUI 3 smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "exact_order_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "exact_order_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- exact-order-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\exact-order-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "------------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "exact_order_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "exact_order_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Ninth round: same exact construction order as the step above, but
      # using the new browser_core::MemoryHistoryStore (a HistoryBackend
      # trait impl added specifically for this — see history.rs) instead of
      # the libsql-backed HistoryStore — a plain Vec<HistoryEntry> behind a
      # RefCell, no SQL, no libsql calls at all in this binary's own code.
      # Note: libsql-ffi is still statically linked into this exe regardless
      # (it's a Cargo *package*-level dependency of browser_core, which this
      # whole crate depends on for the real app — Cargo doesn't support
      # per-binary-target dependency exclusion within one package), so this
      # doesn't test "libsql absent from the binary" (already answered: even
      # `minimal_smoke_test`, which never touches browser_core's history
      # code at all, links the same libsql-ffi and survived) — it tests
      # whether *calling* MemoryHistoryStore's code path specifically,
      # rather than libsql's, changes anything. CONFIRMED (first real run):
      # also survived, real queries and all. Nine for nine.
      - name: Launch MemoryHistoryStore WinUI 3 smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "memory_history_smoke_test.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "memory_history_smoke_test.exe not found under target/ after build"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- memory-history-smoke-trace.log ---"
          Get-Content "$env:GITHUB_WORKSPACE\memory-history-smoke-trace.log" -ErrorAction SilentlyContinue
          Write-Host "---------------------------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "memory_history_smoke_test exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex)"
          } else {
            Write-Host "memory_history_smoke_test is still running after 8 seconds — did NOT crash"
            Stop-Process -Id $proc.Id -Force
          }

      # Checkpoint tracing (see browser-windows-winui/src/lib.rs's trace())
      # proved the crash happens *after* a fully successful startup — window
      # built, page added, activated, ~30 real window messages handled —
      # right at the point WinUI 3 would do its first Composition/DirectX
      # render pass. GitHub Actions' windows-latest runners have no real GPU
      # (a basic/virtual display adapter only), and this exact crash pattern
      # is a documented category for Composition-based UI frameworks on
      # GPU-less machines. WARP (Windows Advanced Rasterization Platform) is
      # Microsoft's own bundled software Direct3D rasterizer, specifically
      # meant for this (server/VM/no-GPU scenarios) — see
      # https://learn.microsoft.com/en-us/windows/win32/direct3darticles/directx-warp.
      # This experiment installs the official "Graphics Tools" Windows
      # Feature-on-Demand (ships `d3dconfig.exe`, a real Microsoft tool for
      # managing the same per-application driver-type overrides the DirectX
      # Control Panel GUI does) and forces WARP for browser-windows-winui.exe
      # specifically. The first version of this step didn't know the real
      # subcommand syntax and dumped `--help` output to discover it — that
      # confirmed `device force-warp[=(true|false)]` is the real one (under
      # d3dconfig's own `device` category, not a `driver-type` subcommand as
      # first guessed). `apps --add <exe>` (used first, to scope subsequent
      # settings to this app rather than system-wide) was confirmed working
      # in that same run.
      - name: Force WARP (software) rendering via d3dconfig
        continue-on-error: true
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
          $d3dconfig = Get-ChildItem -Path "$env:WINDIR\System32" -Filter "d3dconfig.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $d3dconfig) {
            $d3dconfig = (Get-Command d3dconfig.exe -ErrorAction SilentlyContinue).Path
          }
          if (-not $d3dconfig) {
            Write-Host "d3dconfig.exe not found after installing the Graphics Tools feature — skipping this experiment"
            exit 0
          }
          Write-Host "found d3dconfig at $d3dconfig"

          $exe = Get-ChildItem -Recurse -Filter "browser-windows-winui.exe" -Path target -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($exe) {
            Write-Host "registering $exe with d3dconfig"
            & $d3dconfig apps --add $exe 2>&1 | Out-String | Write-Host

            Write-Host "--- d3dconfig device force-warp=true $exe ---"
            & $d3dconfig device "force-warp=true" $exe 2>&1 | Out-String | Write-Host

            Write-Host "--- d3dconfig --export (confirm the setting stuck) ---"
            $exported = "$env:RUNNER_TEMP\d3dconfig-export.txt"
            & $d3dconfig --export $exported 2>&1 | Out-String | Write-Host
            Get-Content $exported -ErrorAction SilentlyContinue | Write-Host
          }

      # windows-latest runners provide a real interactive desktop session
      # (unlike Linux runners), so this can actually launch a visible window
      # and screenshot it — genuine visual confirmation the app renders,
      # rather than only "it compiled and linked."
      #
      # First real run crashed with exit code -1073741189 (0xC000027B,
      # STATUS_STOWED_EXCEPTION — a Windows fast-fail for an unhandled
      # exception, verified against ntstatus.h; an earlier version of this
      # comment guessed DLL_NOT_FOUND without checking, which was wrong).
      # Redirecting stdout/stderr (added after that first run) captured
      # *nothing* on the next run — no panic message, no eprintln! output —
      # meaning the crash happens too early/abruptly for normal stream
      # flushing, consistent with a fast-fail bypassing the CRT's usual
      # cleanup. This version registers a Windows Error Reporting local dump
      # for this exe before launching it, so a genuine crash dump gets
      # written on the next failure — analyzed inline with `cdb` (Windows
      # SDK Debugging Tools) if it's present on this runner image, otherwise
      # uploaded raw as an artifact. This is a real, first-ever debugging
      # pass for browser-windows-winui (see ROADMAP.md) — expect this to
      # take a few more rounds.
      - name: Launch and screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "browser-windows-winui.exe" -Path target |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "browser-windows-winui.exe not found under target/ after build"
            exit 1
          }

          $dumpFolder = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force -Path $dumpFolder | Out-Null
          $werKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\browser-windows-winui.exe"
          New-Item -Path $werKey -Force | Out-Null
          Set-ItemProperty -Path $werKey -Name DumpFolder -Value $dumpFolder -Type ExpandString
          Set-ItemProperty -Path $werKey -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $werKey -Name DumpCount -Value 3 -Type DWord

          $env:RUST_BACKTRACE = "full"
          $stdout = "$env:GITHUB_WORKSPACE\browser-windows-winui-stdout.log"
          $stderr = "$env:GITHUB_WORKSPACE\browser-windows-winui-stderr.log"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8

          Write-Host "--- stdout ---"
          Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content $stderr -ErrorAction SilentlyContinue
          Write-Host "--------------"

          # Temporary: browser-windows-winui/src/main.rs writes checkpoint
          # lines straight to this file (with an explicit sync_all() after
          # each) — see that file's comment. Start-Process's working
          # directory defaults to this step's own (the repo checkout root),
          # so this relative path matches where the app actually wrote it.
          $traceFile = "$env:GITHUB_WORKSPACE\winui-trace.log"
          Write-Host "--- winui-trace.log ---"
          Get-Content $traceFile -ErrorAction SilentlyContinue
          Write-Host "-----------------------"

          if ($proc.HasExited) {
            $hex = "0x{0:X8}" -f $proc.ExitCode

            # Gather every diagnostic *before* the Write-Error below: with
            # $ErrorActionPreference = "Stop" (set at the top of this script),
            # Write-Error throws a terminating error immediately — anything
            # placed after it never runs. (A real bug in an earlier version
            # of this exact step: the dump-analysis code below used to come
            # *after* Write-Error and silently never executed.)

            # WER can take a moment to finish writing the dump after the
            # process actually dies.
            Start-Sleep -Seconds 5
            $dumps = Get-ChildItem -Path $dumpFolder -Filter *.dmp -ErrorAction SilentlyContinue
            if ($dumps) {
              Write-Host "crash dump(s) found: $($dumps.FullName -join ', ')"
              $cdb = Get-Command cdb.exe -ErrorAction SilentlyContinue
              if ($cdb) {
                foreach ($d in $dumps) {
                  Write-Host "--- cdb !analyze -v on $($d.Name) ---"
                  & $cdb.Path -z $d.FullName -c "!analyze -v; q" 2>&1 | Out-String | Write-Host
                }
              } else {
                Write-Host "cdb.exe not found on this runner's PATH — uploading raw dump(s) as artifacts instead"
              }
            } else {
              Write-Host "no crash dump was generated in $dumpFolder"
              Write-Host "diagnosing why: WER service state and debugger availability"
              Get-Service -Name WerSvc -ErrorAction SilentlyContinue | Format-List Name, Status, StartType
              $werDisabled = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name Disabled -ErrorAction SilentlyContinue
              Write-Host "WER Disabled registry value: $($werDisabled.Disabled)"
              $cdbCheck = Get-Command cdb.exe -ErrorAction SilentlyContinue
              Write-Host "cdb.exe on PATH: $(if ($cdbCheck) { $cdbCheck.Path } else { 'not found' })"
              $windbgCheck = Get-Command windbg.exe -ErrorAction SilentlyContinue
              Write-Host "windbg.exe on PATH: $(if ($windbgCheck) { $windbgCheck.Path } else { 'not found' })"
            }

            Write-Error "browser-windows-winui exited on its own within 8 seconds (exit code $($proc.ExitCode) / $hex) — see stdout/stderr and crash dump analysis above, and the logs/dumps uploaded as artifacts"
            exit 1
          }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:GITHUB_WORKSPACE\browser-windows-winui-screenshot.png")

          Stop-Process -Id $proc.Id -Force

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-logs
          path: |
            browser-windows-winui-stdout.log
            browser-windows-winui-stderr.log
            winui-trace.log
            minimal-smoke-trace.log
            titlebar-smoke-trace.log
            webview2-smoke-trace.log
            subclass-smoke-trace.log
            titlebar-webview2-smoke-trace.log
            full-combo-smoke-trace.log
            historystore-smoke-trace.log
            exact-order-smoke-trace.log
            memory-history-smoke-trace.log
          if-no-files-found: ignore

      # Raw dumps, for offline analysis if `cdb` wasn't available on this
      # runner to analyze them inline above.
      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-crash-dumps
          path: ${{ runner.temp }}\dumps\*.dmp
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-winui-screenshot
          path: browser-windows-winui-screenshot.png
          if-no-files-found: ignore
