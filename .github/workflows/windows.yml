name: Windows

# Runs on GitHub's real windows-latest runners — genuine Windows, not a
# cross-compile or Wine emulation. This is deliberately independent of the
# xwin/cargo-xwin cross-compilation setup documented in README.md (used for
# local development on Linux): a native Windows machine already has the real
# MSVC toolchain and Windows SDK, so none of that is needed here.
#
# browser-windows-win32/browser-windows-nwg/browser-wx were deleted from the
# repo entirely (see ROADMAP.md/ARCHITECTURE.md) — unmaintained and behind
# the remaining frontends in scope. browser-windows-winui was deleted too
# (see ROADMAP.md) — WinUI 3 apps crashed with STATUS_STOWED_EXCEPTION on
# this runner's GPU-less environment just before first paint, a fault deep
# inside WinUI 3's own Composition/WinRT internals (confirmed via crash-dump
# analysis, not this codebase's own code) with no workaround found after an
# extensive bisection pass — too problematic to keep maintaining.
# browser-windows-reactor (the one remaining Windows frontend) isn't built
# by this workflow yet either — a real gap, not a deliberate exclusion; it's
# only ever been verified via local cross-compile + a Windows VM used for
# interactive testing so far. Worth adding a build-and-smoke job for it here.

# Manual runs (workflow_dispatch, the "Run workflow" button in the Actions
# tab) or a pushed tag matching v*.* -- NOT every push to master. This
# workflow was originally push-triggered, but during active debugging that
# meant a full Windows Actions run (several minutes, real billed runner time)
# on every single commit, dozens of times over. Push a tag (e.g.
# `git tag v0.1.0-ci && git push origin v0.1.0-ci`) or trigger manually from
# the Actions tab instead.
on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

jobs:
  test-core:
    name: Test browser-core (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # browser-core is meant to work on every platform; encryption-specific
      # tests are #[cfg(target_os = "linux")]-gated (real HistoryStore
      # encryption is Linux-only for now — see Cargo.toml/history.rs) so this
      # exercises everything else for real on native Windows, something the
      # Linux-only local dev loop never has.
      - name: cargo test -p browser-core
        run: cargo test -p browser-core --verbose
