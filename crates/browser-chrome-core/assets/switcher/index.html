<!doctype html>
<!--
  Real switcher page — design 3b of the Claude Design "Browser Concepts"
  project: open pages, bookmarks, and history at a glance, one page with
  four tabs (All/Open Pages/Bookmarks/History). Served by
  EmbeddedAssetServer from the compiled-in assets zip (see build.rs); data
  comes from the real browser_core stores over WebviewRpcServer, not
  fixtures — see internal_rpc.rs on the host side for the methods this
  calls.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Switcher</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="tabbar" id="tabbar">
      <button class="tabbtn active" data-tab="all">All</button>
      <button class="tabbtn" data-tab="open">Open Pages</button>
      <button class="tabbtn" data-tab="bookmarks">Bookmarks</button>
      <button class="tabbtn" data-tab="history">History</button>
      <span style="flex:1"></span>
      <input type="text" id="search" placeholder="Search or switch pages…" style="width:220px">
    </div>
    <div class="columns" id="columns">
      <div class="column" data-column="open">
        <div class="colhead"><span class="sidehead">Open pages</span></div>
        <div class="rows" id="open-rows"></div>
      </div>
      <div class="column" data-column="bookmarks">
        <div class="colhead"><span class="sidehead">Bookmarks</span></div>
        <div class="rows" id="bookmarks-rows"></div>
      </div>
      <div class="column" data-column="history">
        <div class="colhead"><span class="sidehead">Recent history</span></div>
        <div class="rows" id="history-rows"></div>
      </div>
    </div>
  </div>
  <script src="../rpc.js"></script>
  <script src="app.js"></script>
</body>
</html>
