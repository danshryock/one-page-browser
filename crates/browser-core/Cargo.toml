[package]
name = "browser-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
render-engine = { path = "../render-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
percent-encoding = "2"
libsql = { version = "0.9", default-features = false, features = ["core"] }
# libsql's Connection::execute/query are async fns, but never actually async
# for the local backend used here (see history.rs's module doc comment) —
# every call completes on its first poll. `futures_executor::block_on` is a
# plain function (no runtime object, no reactor/timer driver, no threads),
# already resolved transitively via libsql itself (see Cargo.lock), so this
# adds no new crate to the build.
futures-executor = "0.3"
# For `bitwarden.rs`'s `BitwardenBackend`, talking to the `bw` CLI's local
# `bw serve` REST API (see that module's doc comment). Synchronous by
# design (no `.await` anywhere) — `PasswordBackend`'s trait methods are all
# synchronous already, and this only ever talks to a loopback address, so
# there's no async runtime to gain from and no TLS backend to pick (hence
# `default-features = false` — this never makes an HTTPS request).
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
# Test-only: a tiny real HTTP server standing in for `bw serve` in
# `bitwarden.rs`'s tests, so the actual request/response parsing gets
# exercised end-to-end rather than through a mocked trait. Sync, no TLS,
# small — a good fit for "fake server in a test," not shipped in the real
# binary.
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
# `encryption` builds libsql-ffi's bundled SQLite3 Multiple Ciphers via
# CMake, which needs `llvm-lib` when cross-compiling for the MSVC target
# (`cargo build-windows-winui`, via xwin/clang-cl) — not available in this
# environment's toolchain, confirmed by actually hitting the build failure,
# not assumed. Scoping the feature to Linux only (where
# `HistoryStore::open_encrypted` is actually used — see its `#[cfg]` in
# history.rs) sidesteps that entirely, and honors the roadmap item's own
# "if available" wording. `history.rs`'s `#[cfg(not(target_os = "linux"))]`
# fallback keeps every other target's `HistoryStore::open_encrypted` call
# site compiling regardless.
libsql = { version = "0.9", default-features = false, features = ["encryption"] }
# For EncryptionConfig::new's `encryption_key` — already resolved transitively
# via libsql's own "encryption" feature (see Cargo.lock), so this adds no new
# crate to the build.
bytes = "1"
