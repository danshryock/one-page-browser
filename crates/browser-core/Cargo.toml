[package]
name = "browser-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
render-engine = { path = "../render-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
percent-encoding = "2"
libsql = { version = "0.9", default-features = false, features = ["core"] }
