[package]
name = "browser-linux-gtk3"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
render-engine = { path = "../render-engine" }
browser-core = { path = "../browser-core" }
browser-chrome-core = { path = "../browser-chrome-core" }
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# `internal_rpc.rs`'s RPC handler registry (backing the switcher/profile/
# passwords pages — see browser_chrome_core::internal_pages) builds
# `serde_json::Value` request/response bodies and names `rpc_protocol::
# RpcError` directly, the same types `browser-chrome-core`'s own
# `WebviewRpcServer` already uses internally.
serde_json = "1"
rpc-protocol = { path = "../rpc-protocol" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk-test = "0.18"
# Same version `gtk-test` itself pins internally (see its own Cargo.toml) —
# used directly (not via `gtk_test::click`) for the web-standards opener
# test's synthetic click; see that test's doc comment for why.
enigo = "0.0.14"
# Test-only: a fake local server standing in for `bw serve`, same use as in
# browser-core's own bitwarden.rs tests.
tiny_http = "0.12"
