[package]
name = "browser-windows-reactor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
browser-core = { path = "../browser-core" }
browser-chrome-core = { path = "../browser-chrome-core" }
# For the RenderEngine trait, so PageManager<ReactorWebViewEngine> (see
# src/engine.rs) can be reused as-is rather than reinvented. The impl itself
# stays local to this crate rather than living in render-engine, to avoid
# pulling windows-reactor/windows-webview's git dependency into any other
# frontend's build via the shared crate.
render-engine = { path = "../render-engine" }
anyhow = "1"

# windows-reactor/windows-webview are Microsoft's own in-tree Rust bindings
# for WinUI 3 (built on the same windows-bindgen WinMD codegen as the base
# `windows` crate), not yet published to crates.io as real code (the
# crates.io listing is a 0.0.0 placeholder — see
# summaries/windows-github-actions-ci.md's "windows-reactor comparison test"
# section) — hence the git dependency rather than a version. Originally tried
# as a replacement for `winio-winui3` (the community-maintained wrapper the
# now-deleted `browser-windows-winui` depended on — see ROADMAP.md) since a
# comparison smoke test against it survived where that crate's real app
# crashed with STATUS_STOWED_EXCEPTION under winio-winui3 — see that same
# doc section for the full investigation.
#
# MSVC-only gating: WinRT/COM interop needs MSVC specifically, not the
# x86_64-pc-windows-gnu target the other Windows crates in this workspace
# used to use.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows-reactor = { git = "https://github.com/microsoft/windows-rs" }
windows-webview = { git = "https://github.com/microsoft/windows-rs", features = ["reactor"] }
# Same git source/commit as the two deps above (not crates.io's windows-core)
# — needed by src/xaml_interop.rs, which casts the raw `IInspectable` handle
# `windows-webview`'s `webview()` hands back in `on_mounted`/`on_unmounted`
# to a locally-defined `IUIElement` shim so `UIElement.Visibility` can be set
# directly. Pulling in a different windows-core than windows-reactor/
# windows-webview themselves use would make their `IInspectable` and ours
# distinct, incompatible types even though structurally identical.
windows-core = { git = "https://github.com/microsoft/windows-rs" }
# Same git source as the three deps above, for raw `SetTimer`/`KillTimer` —
# see `page_element`'s `on_ready` doc comment on why the console-capture
# script registration needs deferring off this callback's own call stack.
windows = { git = "https://github.com/microsoft/windows-rs", rev = "b9e0aa360b8b6caa7dfc6038b5bc6603eed3bb8c", features = [
    "winuser",
] }

# Deliberately NOT target-gated like the two deps above, despite being
# windows-only at runtime — see build.rs's doc comment for why: a
# `#[cfg(target_os = "windows")]` written inside build.rs's own source
# reflects the HOST build.rs compiles for, not the crate's actual
# `--target`, so gating this dependency's *use* that way silently no-ops
# during cross-compilation (cargo-xwin's host is still Linux) even though
# Cargo correctly includes the dependency itself for a windows-msvc target.
# Real bug hit once already: the cross-compiled .exe was missing
# `Microsoft.WindowsAppRuntime.Bootstrap.dll` because of exactly this.
[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs" }
