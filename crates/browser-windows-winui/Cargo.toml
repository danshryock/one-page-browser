[package]
name = "browser-windows-winui"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
render-engine = { path = "../render-engine" }
browser-core = { path = "../browser-core" }
browser-chrome-core = { path = "../browser-chrome-core" }
anyhow = "1"

# WinUI 3 (Microsoft.UI.Xaml.*) needs MSVC specifically, not the
# x86_64-pc-windows-gnu target the other Windows crates in this workspace
# use — COM/WinRT interop is far better supported on MSVC. Cross-compiled via
# `cargo xwin` (see README.md), not `cross`/plain `cargo build --target`.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    # For subclassing the top-level HWND (SetWindowSubclass/DefSubclassProc)
    # to handle keyboard shortcuts and window-close — this crate's bindings
    # have no working way to subscribe to Window::Closed or any KeyDown
    # event at all (see src/lib.rs's module doc comment), so those go
    # through the raw HWND instead — a standard Win32 technique, not
    # something specific to this crate's bindings.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.62"
# "native" exposes `winui3::IWindowNative`, needed to get the raw HWND out of
# a `Microsoft.UI.Xaml.Window` for the subclassing above. "UI_Xaml_Media" adds
# `SolidColorBrush`, used for tile/scrim backgrounds.
winio-winui3 = { version = "0.4", features = ["UI_Composition", "UI_Xaml_Controls_Primitives", "UI_Windowing", "native"] }
