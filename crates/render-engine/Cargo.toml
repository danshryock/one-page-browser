[package]
name = "render-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"

# Only linux.rs and windows.rs (the gnu-target Win32 backend) use wry — the
# msvc-target WinUI 3 backend (winui.rs) wraps the native
# Microsoft.UI.Xaml.Controls.WebView2 control directly, no wry involved.
# Excluding wry there keeps that target's dependency tree free of
# wry/webview2-com, which it never needs.
[target.'cfg(any(target_os = "linux", all(target_os = "windows", target_env = "gnu")))'.dependencies]
wry = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# For `screenshot`: `wry::WebViewExtUnix::webview()` hands back the raw
# webkit2gtk `WebView`, whose `.snapshot()` is what actually captures a
# page. Already resolved in the workspace's dependency tree via wry/gtk
# themselves, so adding it directly here doesn't pull in anything new.
webkit2gtk = "2.0"
# `gtk` re-exports this same cairo-rs as `gtk::cairo`, but without its
# `png` feature enabled (nothing else in this workspace needed PNG
# encoding before now) — depending on it directly here with `png` turned
# on unifies with that same dependency and enables `ImageSurface::write_to_png`
# everywhere, including through the `gtk::cairo` re-export.
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-core = "0.62"
winio-winui3 = { version = "0.4", features = ["UI_Composition", "UI_Xaml_Controls_Primitives", "Web_WebView2_Core"] }
