[package]
name = "web-standards-tests"
version = "0.1.0"
edition = "2021"
license.workspace = true

# One binary per platform (mirroring how `render-engine` splits
# `linux.rs`/`macos.rs`) — each is `#[cfg(target_os = "...")]`-gated
# internally (see its own `main` for the real vs. stub split, the same
# pattern `browser-windows-reactor`'s `main.rs` already uses), so this crate
# builds cleanly on every host even though each binary only *does* anything
# on its own target platform.
[[bin]]
name = "web-standards-driver-windows"
path = "src/bin/windows_driver.rs"

[[bin]]
name = "web-standards-driver-macos"
path = "src/bin/macos_driver.rs"

[dependencies]
anyhow = "1"
# Parses each fixture's `actions.json` (see `web-standards-tests/fixtures/`'s
# layout) — the same data-driven-interaction format `browser-linux-gtk3`'s
# in-process test (`crates/browser-linux-gtk3/tests/gtk_tests.rs`) already
# reads.
serde_json = "1"
# Serves fixtures over real http://127.0.0.1 instead of file:// — needed on
# macOS (wry's macOS `navigate_to_url` uses a plain `loadRequest:` for every
# URL scheme, but WKWebView only reliably loads local content via the
# distinct `loadFileURL:allowingReadAccessToURL:` API; a `file://` URL
# through `loadRequest:` never actually commits navigation at all — confirmed
# directly on real hardware, `didCommitNavigation` never fires, so wry's own
# pending-script queue never flushes either) and reused unconditionally
# (Windows too, not target-gated) for consistency between the two external
# drivers now that both are socket-based — same fix, same reasoning, as
# `browser-linux-gtk3/tests/gtk_tests.rs`'s own `FixtureServer` for the
# analogous GTK-side wry bug.
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
